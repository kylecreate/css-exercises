<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Modal</title>
</head>

<body>

  <div class="modal-outside-container">

    <div class="modal-icon">!</div>

    <div class="modal-inside-container">

      <div class="modal-header">Are you sure you want to do that?

        <button class="modal-close-button">✖</button>

      </div>

      <p class="modal-text">Lorem ipsum dolor sit amet consectetur adipisicing elit. Pariatur excepturi id soluta, numquam minima rerum doloremque eveniet aspernatur beatae commodi. Cupiditate recusandae ad repellendus quidem consectetur sequi amet aspernatur cumque!</p>

      <button class="modal-continue-btn">Continue</button>
      <button class="modal-cancel-btn">Cancel</button>
    </div>

  </div>

</body>

</html>
